<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1d120c" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Kolkata, on Repeat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <main class="hero">
      <video class="hero-video" autoplay muted loop playsinline>
        <source src="/1786447129350824.mp4" type="video/mp4" />
      </video>
      <div class="scrim" aria-hidden="true"></div>

      <div class="topbar">
        <time id="clock"></time>
        <a class="spotify-link" href="https://open.spotify.com/playlist/74ZzciAqhyRPskpAtXuBPN" target="_blank" rel="noreferrer"><span class="spotify-mark" aria-hidden="true"></span> Spotify <span class="external" aria-hidden="true">↗</span></a>
      </div>

      <section class="headline" aria-labelledby="page-title">
        <h1 id="page-title">KOLKATA,<br />ON REPEAT</h1>
        <p>A city that always had a soundtrack.</p>
      </section>

      <section class="player-zone" aria-label="Music player">
        <div class="player">
          <div class="album-art"><img id="artwork" src="/placeholder-art.svg" alt="Loading track artwork" /></div>
          <div class="track-info">
            <div class="track-copy"><h2 id="track-name">Loading playlist…</h2><p id="track-artist">YouTube Music</p></div>
            <div class="timeline">
            <input id="progress" class="progress" type="range" min="0" max="100" value="0" aria-label="Track progress" />
              <div><span id="current-time">0:00</span><span id="duration">0:00</span></div>
            </div>
          </div>
          <div class="controls">
            <button class="icon-control optional" id="previous" type="button" aria-label="Previous track">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14M18 6 9 12l9 6V6Z"/></svg>
            </button>
            <button class="play-button" id="play-pause" type="button" aria-label="Play">
            <svg id="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7V5Z"/></svg>
            <svg id="pause-icon" class="hidden" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg>
            </button>
            <button class="icon-control optional" id="next" type="button" aria-label="Next track">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14M6 6l9 6-9 6V6Z"/></svg>
            </button>
            <button class="icon-control optional" id="repeat" type="button" aria-label="Repeat off" aria-pressed="false">
              <svg class="loop-icon" viewBox="0 0 15 15" aria-hidden="true"><path d="M0 0h15v15H0z" fill="none"/><path fill="currentColor" d="m14.5 3.5l.354.354a.5.5 0 0 0 0-.708zm-14 8l-.354-.354a.5.5 0 0 0 0 .708zM11.146.854l3 3l.708-.708l-3-3zm3 2.292l-3 3l.708.708l3-3zm-10.292 11l-3-3l-.708.708l3 3zm-3-2.292l3-3l-.708-.708l-3 3zM.5 12h11v-1H.5zM15 8.5V7h-1v1.5zM11.5 12A3.5 3.5 0 0 0 15 8.5h-1a2.5 2.5 0 0 1-2.5 2.5zm3-9h-11v1h11zM0 6.5V8h1V6.5zM3.5 3A3.5 3.5 0 0 0 0 6.5h1A2.5 2.5 0 0 1 3.5 4z"/></svg>
            </button>
          </div>
        </div>
        <p class="player-message" id="player-message" role="status"></p>
      </section>
      <p class="developer-credit">Developed by <a href="https://pritydhara.webflow.io/" target="_blank" rel="noreferrer">Prity Dhara</a></p>
      <div id="youtube-player" aria-hidden="true"></div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
